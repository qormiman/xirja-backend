# ============================================================================
# Runs the Welbee's crawler on a schedule, using GitHub's own computers --
# nothing needs to stay running on your own machine.
#
# 19 Aug 2026 -- this used to be simpler than the Greens workflow (no login,
# no headless browser step, just install Python packages and run the
# script), same as PAVI PAMA. That stopped working: welbees.mt started
# returning "403 Forbidden" on every plain request, most likely because it
# (or a security layer in front of it) can tell a plain scripted request
# apart from a real browser. welbees_crawler.py now drives a real, invisible
# (headless) browser instead -- same fix, same tool (Playwright), same extra
# install step the Greens workflow already needed for its own reasons -- see
# the "How this evolved" section of welbees_crawler.py's own docstring for
# the full story.
#
# Two ways this runs:
#   1. Automatically, every night (see the "schedule" below) -- same time as
#      the Greens and PAVI PAMA crawls. Running all three at once is safe:
#      they write to entirely separate parts of the database, and three open
#      connections is nowhere near any limit Neon would enforce.
#   2. Manually, whenever you want, by clicking a button -- see SETUP.md for
#      exactly where. Use this the first time, to check it actually works.
#
# Every run's outcome (worked / failed, how many products found) is recorded
# in the crawl_run table in the database, and also visible in GitHub's own
# "Actions" tab for this repository as a green tick or red cross.
# ============================================================================

name: Crawl Welbee's prices

on:
  schedule:
    # Runs at 23:00 UTC every night -- 1 AM Malta time right now (summer /
    # CEST, UTC+2), same time as the Greens and PAVI PAMA crawls. Drifts to
    # 12 AM Malta time once clocks fall back in late October (see
    # crawl-greens.yml for why this is an accepted trade-off rather than
    # something to fix).
    - cron: '0 23 * * *'

  # Adds a "Run workflow" button on the Actions tab, so you can trigger a
  # run by hand at any time -- this is how you'll do the first test run.
  workflow_dispatch:
    inputs:
      only_categories:
        description: >-
          Optional. Leave blank for a normal, full run of every category
          (this is what you want almost all the time). Fill this in only to
          patch specific categories without waiting through a full crawl
          again -- comma-separated category codes, e.g. "D-5431" or
          "D-5431,D-5435". Must match a code in welbees_crawler.py's
          CATEGORIES list.
        required: false
        default: ''

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 20 Aug 2026 -- this step kept HANGING (15+ minutes, twice in a row,
      # then again after a cancel-and-retry). The cause is visible in the
      # log: GitHub's Ubuntu runners are configured to fetch system packages
      # from a Microsoft-run mirror (azure.archive.ubuntu.com), and that
      # mirror was refusing connections -- you can see apt retry the same
      # four "Ign:" lines over and over before eventually falling back to
      # the public archive.ubuntu.com. Nothing to do with this crawler or
      # with Playwright; it just happens to be the first step that needs
      # apt at all.
      #
      # Rather than keep re-running and hoping for a healthy runner, this
      # points apt straight at the public Ubuntu archive first, skipping
      # the flaky Azure mirror entirely. "|| true" so that if GitHub ever
      # changes where this file lives, this step quietly does nothing
      # instead of failing the whole run.
      - name: Use the public Ubuntu package mirror (avoids a flaky GitHub one)
        run: |
          echo "http://archive.ubuntu.com/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt || true

      - name: Install the headless browser Playwright needs
        # Same as the Greens workflow's own copy of this step -- downloads a
        # real (invisible) copy of Chromium for the crawler to drive, takes
        # a minute or so, nothing to do on your end.
        #
        # timeout-minutes: if this somehow still gets stuck, the step now
        # gives up after 10 minutes and fails loudly, instead of sitting
        # there burning up to GitHub's full 6-hour job ceiling while you
        # watch it. A failure here is a "re-run it" situation, not a code
        # problem.
        timeout-minutes: 10
        run: playwright install --with-deps chromium

      - name: Run the Welbee's crawler
        env:
          # Same secret the Greens and PAVI PAMA workflows use -- one
          # database, shared across every chain's crawler. See SETUP.md if
          # this isn't set yet.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONUNBUFFERED: "1"
          ONLY_CATEGORIES: ${{ github.event.inputs.only_categories }}
        run: python welbees_crawler.py
