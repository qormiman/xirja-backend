# ============================================================================
# Fills in listing.shopping_category for every listing, using the rules in
# category_taxonomy.py -- this is what lets the app later search "milk" (or
# "shampoo", or "beef") across all three chains at once, without needing to
# know that two listings are the exact same physical product. See SETUP.md's
# "Category normalization" section for the full explanation.
#
# Safe to run any time, as often as you like -- it only ever reads and
# writes your own database, never touches any of the three sites, and only
# writes rows whose category actually changed.
#
# Two ways this runs:
#   1. Automatically, every 3 days (see "schedule" below) -- catches
#      whatever the nightly crawls have added since the last run and
#      re-classifies it against whatever rules already exist in
#      category_taxonomy.py at that point. This does NOT invent new
#      keyword rules by itself -- it only applies the ones already
#      written. Genuinely new/unrecognised brand names still show up in
#      this run's "unclassified" report and need a person (or Claude,
#      doing a research round) to add a rule for them.
#   2. Manually, whenever you want, by clicking "Run workflow" on the
#      Actions tab -- useful right before a categorization review, so
#      the report you're looking at is as fresh as possible.
#
# 20 Aug 2026 -- this run always shows green now, even when some listings
# are still unclassified: categorizing itself always succeeds and writes
# its results either way, so a red "failed" X was misleading (it looked
# like the workflow was broken, not like "some listings need new keyword
# rules"). Up to 18 Aug 2026 this deliberately exited non-zero just to
# trigger GitHub's automatic failure-notification email; that's now done
# instead via a GitHub Issue that categorize_listings.py opens (or
# updates) using the `gh` CLI when there's something to flag, and closes
# automatically once nothing's unclassified -- same email inbox, no red
# X. See github_issue_notify.py's own docstring for the full reasoning.
# `permissions: issues: write` and the GH_TOKEN below are what let the
# script actually create/comment/close issues in this repo.
# ============================================================================

name: Categorize listings

on:
  schedule:
    # Runs at 04:00 UTC every 3rd day of the month (1st, 4th, 7th, ...) --
    # a few hours after the nightly crawls (23:00 UTC) so that night's new
    # listings are already in the database. Note: because GitHub Actions
    # cron only understands "day of month", not a true rolling "every 3
    # days", the gap can occasionally shrink to 1 day or stretch to 4 at
    # a month boundary (e.g. the 31st to the 1st) -- a known, accepted
    # trade-off, same kind of thing as the crawlers' own DST drift.
    - cron: '0 4 */3 * *'

  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  categorize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Categorize listings
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONUNBUFFERED: "1"
          # Lets the script use the `gh` CLI to open/update/close a
          # GitHub Issue when there's something to flag -- see
          # github_issue_notify.py. GITHUB_TOKEN is provided automatically
          # by GitHub Actions for every run, no secret to set up.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python categorize_listings.py

      # The printed report only shows 8 example names per unclassified
      # bucket, which is nowhere near enough when a bucket holds 3,000 of
      # them -- you close 8 and get 8 more next time. The script also writes
      # the COMPLETE list of distinct unclassified names to
      # unclassified_listings.txt; this step attaches that file to the run so
      # it can be downloaded from the "Artifacts" box at the bottom of the
      # run's summary page and worked through in one go.
      #
      # if: always() so the file is still attached even when the run failed
      # partway -- a partial list is far more useful than none.
      - name: Attach the full unclassified list
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unclassified-listings
          path: unclassified_listings.txt
          if-no-files-found: warn
          retention-days: 30
