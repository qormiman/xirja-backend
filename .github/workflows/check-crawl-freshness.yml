# ============================================================================
# Runs check_crawl_freshness.py on a schedule -- this is the piece that
# closes the last real gap in Xirja's failure alerting. The crawl and
# categorize workflows already email you when a job CRASHES; this one
# catches the sneakier case where a crawler runs "successfully" every night
# but quietly stops finding real prices (site layout changed, got blocked,
# etc), which wouldn't raise a Python exception at all.
#
# Read-only: this only ever reads the crawl_run and outlet tables, never
# touches any of the three sites, never writes anything.
#
# Two ways this runs:
#   1. Automatically, once a day (see "schedule" below) -- a few hours
#      after the nightly crawls (23:00 UTC) and the categorize job, so by
#      the time this checks, that night's crawl_run rows already exist.
#   2. Manually, whenever you want, by clicking "Run workflow" on the
#      Actions tab.
#
# 20 Aug 2026 -- this run always shows green now, even when a problem is
# found: the healthcheck itself always runs successfully, so a red
# "failed" X was misleading (it looked like the workflow was broken, not
# like "a chain's prices may be going stale"). Up to 18 Aug 2026 this
# deliberately exited non-zero just to trigger GitHub's automatic
# failure-notification email; that's now done instead via a GitHub Issue
# that check_crawl_freshness.py opens (or updates) using the `gh` CLI when
# there's something to flag, and closes automatically once every outlet's
# healthy again -- same email inbox, no red X. See github_issue_notify.py's
# own docstring for the full reasoning. `permissions: issues: write` and
# the GH_TOKEN below are what let the script actually create/comment/close
# issues in this repo.
# ============================================================================

name: Crawl freshness healthcheck

on:
  schedule:
    # Runs at 06:00 UTC every day -- after the nightly crawls (23:00 UTC)
    # and after the categorize job's own 04:00 UTC slot, so both have had
    # time to finish and write their crawl_run / shopping_category updates
    # before this checks anything.
    - cron: '0 6 * * *'

  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check crawl freshness
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONUNBUFFERED: "1"
          # Lets the script use the `gh` CLI to open/update/close a
          # GitHub Issue when there's something to flag -- see
          # github_issue_notify.py. GITHUB_TOKEN is provided automatically
          # by GitHub Actions for every run, no secret to set up.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python check_crawl_freshness.py
